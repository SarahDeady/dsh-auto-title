url: https://github.com/SarahDeady/dsh-auto-title
name: SarahDeady/dsh-auto-title
category: session
description:
  en: Summarizes the conversation into a session title of at most 12 CJK characters, keeps it updated as the chat grows, stops after the user renames the session, and adds a refresh row to the session menu.
  zh: 把对话总结成最多 12 个字的会话标题，随对话推进自动更新；用户手动改名后自动停手；侧栏会话「⋯」菜单里可一键重新提炼。
